# Alembic 配置（P-2 起正式迁移机制）。
# 数据库地址不在本文件硬编码：由 migrations/env.py 按
# 程序传入 engine > -x db=path > app.config.DB_PATH 顺序解析。
# 常用命令（Git Bash，在 content-factory 目录下）：
#   生成迁移：.venv/Scripts/alembic -x db=data/app.db revision --autogenerate -m "说明"
#   升级到最新：.venv/Scripts/alembic -x db=data/app.db upgrade head
#   查看当前版本：.venv/Scripts/alembic -x db=data/app.db current
[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
