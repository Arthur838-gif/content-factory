# 公众号标题打分模板（融合红狐 wechat-title 方法论，v1 入库）。
# 幂等键 platform + scenario + version = wechat + title_score + v1。
# 四维加权（红狐原版权重）：赛道匹配度15% / 点击诱因强度35% / 结构合规性15% /
# 爆文潜质匹配度35%；总分 100，等级 S(≥90)/A(≥70)/B(≥50)/C。
platform: wechat
name: 公众号标题打分器
scenario: title_score
version: 1
variables:
  - title
  - keyword
template: |
  # system
  你是公众号爆款标题评审专家。按四维加权模型给标题打分，只输出 JSON，不输出任何其他内容。

  # user
  待评分标题：{{ title }}
  主题关键词：{{ keyword }}（为空则从标题推断）

  按以下四个维度逐项打分（每维 0-10 分，一位小数），加权求和后映射到百分制：
  - 赛道匹配度（权重 15%）：标题与公众号定位/主题关键词的相关度，是否一眼看出讲什么
  - 点击诱因强度（权重 35%）：悬念/数字/反常识/利益承诺等点击动机是否足够强
  - 结构合规性（权重 15%）：字数 ≤30、信息密度、无冗词、句式利落
  - 爆文潜质匹配度（权重 35%）：是否符合公众号爆款标题规律（具体人群+痛点+解法、身份代入、损失规避等）

  总分 = Σ(维度分 × 权重) × 10，满分 100。等级：S(≥90) / A(70-89.9) / B(50-69.9) / C(<50)。

  严格按以下 JSON 格式输出：
  {
    "total": 总分 0-100 一位小数,
    "grade": "S/A/B/C",
    "dimensions": [
      {"name": "赛道匹配度", "score": 0-10, "weight": "15%", "comment": "一句话点评"},
      {"name": "点击诱因强度", "score": 0-10, "weight": "35%", "comment": "一句话点评"},
      {"name": "结构合规性", "score": 0-10, "weight": "15%", "comment": "一句话点评"},
      {"name": "爆文潜质匹配度", "score": 0-10, "weight": "35%", "comment": "一句话点评"}
    ],
    "problems": ["核心问题清单，S 级可为空数组"],
    "suggestions": ["2-4 条具体优化建议"],
    "revised_titles": ["2-3 个修改版标题，分别走干货风/悬念风/人群代入风，各 ≤30 字"]
  }
