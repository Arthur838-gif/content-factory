# 小红书标题打分模板（融合红狐 xiaohongshu-title-score 方法论，v1 入库）。
# 幂等键 platform + scenario + version = xhs + title_score + v1。
# 六维加权（红狐原版权重）：主题匹配度15% / 结构合规度20% / 利益清晰度25% /
# 情绪唤醒度20% / 稀缺性感知15% / 合规安全性5%；等级 S/A/B/C。
platform: xhs
name: 小红书标题打分器
scenario: title_score
version: 1
variables:
  - title
  - keyword
template: |
  # system
  你是小红书爆款标题评审专家。按六维加权模型给标题打分，只输出 JSON，不输出任何其他内容。

  # user
  待评分标题：{{ title }}
  主题关键词：{{ keyword }}（为空则从标题推断）

  按以下六个维度逐项打分（每维 0-10 分，一位小数），加权计算综合分：
  - 主题匹配度（权重 15%）：标题与主题关键词的相关度，是否一眼看出讲什么
  - 结构合规度（权重 20%）：字数 ≤20、信息密度、无冗词、句式利落
  - 利益清晰度（权重 25%）：用户能获得什么（干货/避坑/省钱/省时间）是否明确
  - 情绪唤醒度（权重 20%）：是否有情绪词/数字/emoji、能否引发点击冲动
  - 稀缺性感知（权重 15%）：是否显得独家/新鲜/难得（"别再""少走弯路""内行"类信号）
  - 合规安全性（权重 5%）：无夸大绝对化用语、无敏感词、无虚假承诺

  等级：S(≥9.0) / A(7.0-8.9) / B(5.0-6.9) / C(<5.0)。

  严格按以下 JSON 格式输出：
  {
    "total": 综合分 0-10 一位小数,
    "grade": "S/A/B/C",
    "dimensions": [
      {"name": "主题匹配度", "score": 0-10, "weight": "15%", "comment": "一句话点评"},
      {"name": "结构合规度", "score": 0-10, "weight": "20%", "comment": "一句话点评"},
      {"name": "利益清晰度", "score": 0-10, "weight": "25%", "comment": "一句话点评"},
      {"name": "情绪唤醒度", "score": 0-10, "weight": "20%", "comment": "一句话点评"},
      {"name": "稀缺性感知", "score": 0-10, "weight": "15%", "comment": "一句话点评"},
      {"name": "合规安全性", "score": 0-10, "weight": "5%", "comment": "一句话点评"}
    ],
    "problems": ["核心问题清单，S 级可为空数组"],
    "suggestions": ["2-4 条具体优化建议"],
    "revised_titles": ["2-3 个修改版标题，分别走干货风/情绪风/猎奇风，各 ≤20 字"]
  }
