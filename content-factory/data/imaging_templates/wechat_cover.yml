# 公众号封面版式（900×383，2.35:1）。P2 只做独立渲染验证，调用方 M6（微信草稿箱）后续接入。
name: wechat_cover
canvas: { width: 900, height: 383 }
background: { color: "#ffffff" }
font:
  regular: SourceHanSansSC-Regular.otf
  bold: SourceHanSansSC-Bold.otf
slots:
  - id: side_bar
    type: rect
    box: { x: 0, y: 0, width: 14, height: 383 }
    color: "#4b3fe3"
  - id: headline
    type: text
    box: { x: 70, y: 60, width: 780, height: 263 }
    font: { size: 72, weight: bold, color: "#1a1b25", line_height: 1.3 }
    align: left
    valign: middle
    shrink_to_fit: true
